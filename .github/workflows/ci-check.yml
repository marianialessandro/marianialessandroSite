name: CI - Build Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  wordpress-check:
    name: WordPress migration and dynamic blog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
      - run: npm ci
      - run: composer install --working-dir services/blog-wordpress --no-interaction --prefer-dist --no-progress
      - run: python3 services/blog-wordpress/deploy/build.py --output services/blog-wordpress/build
      - run: python3 services/blog-wordpress/deploy/build_frontend.py --output services/blog-wordpress/public/build
      - run: docker compose -f services/blog-wordpress/compose.yml up -d --wait
      - name: Test real WordPress authentication and migration
        run: docker compose -f services/blog-wordpress/compose.yml exec -T wordpress php /var/www/tests/integration.php
      - name: Test phpMyAdmin SQL bootstrap
        run: python3 services/blog-wordpress/tests/sql_bootstrap.py
      - run: npm test --workspace @marianialessandro/blog.marianialessandro.com
      - name: Test dynamic pages without rebuilding
        run: python3 services/blog-wordpress/tests/dynamic_blog.py
      - if: always()
        run: docker compose -f services/blog-wordpress/compose.yml down --volumes

  build-check:
    name: Check Build Integrity
    runs-on: ubuntu-latest
    env:
      PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api
      APP_ENV: testing
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_DEBUG: 'true'
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/blog-ci.sqlite
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Test API
        working-directory: apps/api.marianialessandro.com
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          php artisan test

      - name: 🧪 Test blog
        run: npm test --workspace @marianialessandro/blog.marianialessandro.com

      - name: 🔨 Build against temporary API
        run: |
          bash apps/api.marianialessandro.com/deploy/shared-hosting/build.sh \
            apps/api.marianialessandro.com \
            "$RUNNER_TEMP/api-deploy"

          touch "$DB_DATABASE"
          php apps/api.marianialessandro.com/artisan migrate --force --no-interaction
          php apps/api.marianialessandro.com/artisan posts:import-markdown \
            --path="$GITHUB_WORKSPACE/apps/blog.marianialessandro.com/src/posts"

          (
            cd "$RUNNER_TEMP/api-deploy"
            php -S 127.0.0.1:8000 \
              "$RUNNER_TEMP/api-deploy/vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"
          ) > "$RUNNER_TEMP/blog-build-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --max-time 5 http://127.0.0.1:8000/api/health > /dev/null; then
              npm run build
              exit 0
            fi

            sleep 1
          done

          cat "$RUNNER_TEMP/blog-build-api.log"
          echo "::error::Temporary API did not start."
          exit 1
      # Niente deploy qui! Se la build fallisce, l'azione diventa rossa.
