name: CD - Deploy marianialessandro.com

on:
  push:
    branches:
      - main
  # Opzionale: permette di lanciare il deploy manualmente dalla tab Actions
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy marianialessandro.com
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build marianialessandro.com
        run: npm run build:site

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          protocol: ftp
          port: 21

          local-dir: apps/marianialessandro.com/build/
          server-dir: public_html/

          # Importante: evita wipe totale e mantiene il file di stato,
          # così i deploy successivi caricano solo le differenze.
          dangerous-clean-slate: false

          # Per vedere quale comando riceve "502 Command not implemented"
          log-level: verbose

          # Un po' più tollerante su server lenti
          timeout: 60000
