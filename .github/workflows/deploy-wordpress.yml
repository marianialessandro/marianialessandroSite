name: CD - Deploy WordPress CMS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-blog-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
      - name: Install CMS integration dependencies
        run: composer install --working-dir services/blog-wordpress --no-dev --prefer-dist --no-progress --optimize-autoloader
      - name: Audit CMS integration dependencies
        run: composer audit --working-dir services/blog-wordpress --locked --no-dev
      - name: Build verified WordPress release
        run: python3 services/blog-wordpress/deploy/build.py --output services/blog-wordpress/build
      - name: Sync CMS files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: services/blog-wordpress/build/
          server-dir: blog.marianialessandro.com/cms/
          state-name: .ftp-deploy-sync-state-wordpress.json
          dangerous-clean-slate: false
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            blog-config.php
            wp-content/uploads/**
            !wp-content/uploads/.htaccess
            wp-content/cache/**
            wp-content/upgrade/**
            .well-known/**
      - name: Verify deployed CMS
        run: |
          # PHP variables must remain literal to the shell.
          # shellcheck disable=SC2016
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors --max-time 20 \
            'https://blog.marianialessandro.com/cms/?rest_route=/portfolio/v1/health' \
            | php -r '$data = json_decode(stream_get_contents(STDIN), true); if (($data["status"] ?? null) !== "ok") { fwrite(STDERR, "CMS readiness check failed. Verify private configuration, database installation and PHP extensions.\n"); exit(1); }'
          for path in blog-config.php wp-config.php; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "https://blog.marianialessandro.com/cms/$path")"
            if [ "$status" != 403 ] && [ "$status" != 404 ]; then
              echo "::error::CMS configuration is not protected: $path ($status)"
              exit 1
            fi
          done
