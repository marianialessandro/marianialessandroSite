services:
  wordpress:
    image: wordpress:php8.3-apache
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./build:/var/www/html
      - ./tests:/var/www/tests:ro
    environment: &wordpress-environment
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: blog_wordpress_local
      WORDPRESS_DB_USER: blog_local
      WORDPRESS_DB_PASSWORD: local-development-only
      WORDPRESS_URL: http://localhost:8080
      BLOG_FRONTEND_URL: http://localhost:5175
      BLOG_ALLOW_LEGACY_IMPORT: 'true'
      AUTH_KEY: local-development-auth-key
      SECURE_AUTH_KEY: local-development-secure-auth-key
      LOGGED_IN_KEY: local-development-logged-in-key
      NONCE_KEY: local-development-nonce-key
      AUTH_SALT: local-development-auth-salt
      SECURE_AUTH_SALT: local-development-secure-auth-salt
      LOGGED_IN_SALT: local-development-logged-in-salt
      NONCE_SALT: local-development-nonce-salt
    depends_on:
      mysql:
        condition: service_healthy
  blog:
    image: wordpress:php8.3-apache
    ports:
      - '127.0.0.1:8081:80'
    volumes:
      - ./public/build:/var/www/html
      - ./build:/var/www/html/cms
      - ./tests:/var/www/tests:ro
    environment:
      <<: *wordpress-environment
      WORDPRESS_URL: http://localhost:8081/cms
      BLOG_FRONTEND_URL: http://localhost:8081
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: blog_wordpress_local
      MYSQL_USER: blog_local
      MYSQL_PASSWORD: local-development-only
      MYSQL_ROOT_PASSWORD: local-development-root-only
    volumes:
      - wordpress-mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent']
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  wordpress-mysql-data:
